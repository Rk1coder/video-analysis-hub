name: Test and sync Hugging Face Space

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check analysis.py app.py server.py tests

  sync:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Explain missing deployment credentials
        if: env.HF_TOKEN == ''
        run: echo "Tests passed. Add the HF_TOKEN repository secret with write access to rabitrabi/video-analysis-hub to enable deployment."
      - name: Install the Hub client
        if: env.HF_TOKEN != ''
        run: python -m pip install huggingface-hub==0.36.2
      - name: Upload verified runtime files without rewriting Space history
        if: env.HF_TOKEN != ''
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id="rabitrabi/video-analysis-hub",
              repo_type="space",
              folder_path=".",
              allow_patterns=[
                  "app.py", "analysis.py", "server.py", "requirements.txt",
                  "README.md", "examples/*.jpg",
              ],
              commit_message="Sync tested GitHub source " + os.environ["GITHUB_SHA"][:7],
          )
          PY
