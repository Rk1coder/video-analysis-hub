services:
  api:
    build: .
    environment:
      HF_HOME: /cache/huggingface
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-google/gemma-3-4b-it}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/cache/huggingface

  ui:
    build: .
    command: python app.py
    environment:
      HF_HOME: /cache/huggingface
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-google/gemma-3-4b-it}
    ports:
      - "7860:7860"
    volumes:
      - hf_cache:/cache/huggingface

  # Optional: requires an NVIDIA GPU, model access and an HF_TOKEN.
  # VLLM_ENDPOINT=http://vllm:8000 docker compose --profile gpu up --build
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.11.0
    command: --model ${GEMMA_MODEL:-google/gemma-3-4b-it} --dtype auto --max-model-len 8192
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
